services:
  webbanhang:
    image: webbanhang:latest
    build:
      context: .
      dockerfile: webbanhang/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=WebBanHang-docker;User Id=sa;Password=Ctt@1234;TrustServerCertificate=True
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Ctt@1234
    ports:
      - "1434:1433"
    volumes:
      - sqldata:/var/opt/mssql

volumes:
  sqldata:
