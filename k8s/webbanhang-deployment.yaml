apiVersion: apps/v1
kind: Deployment
metadata:
  name: webbanhang
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: webbanhang
  template:
    metadata:
      labels:
        app: webbanhang
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: webbanhang
                topologyKey: kubernetes.io/hostname
      containers:
        - name: webbanhang
          image: thanhvippro/webbanhang:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: Vault__Address
              value: "http://vault:8200"
            - name: Vault__Token
              valueFrom:
                secretKeyRef:
                  name: vault-secret
                  key: vault-token
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
