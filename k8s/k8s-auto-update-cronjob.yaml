apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8s-auto-update-webbanhang
spec:
  # Kiem tra va cap nhat moi 1 phut
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: auto-update-sa
          restartPolicy: OnFailure
          containers:
            - name: updater
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  echo "Dang kiem tra cap nhat cho webbanhang tren K8s..."
                  kubectl rollout restart deployment/webbanhang
                  echo "Da gui tin hieu RollingUpdate den webbanhang!"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auto-update-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auto-update-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auto-update-rb
subjects:
  - kind: ServiceAccount
    name: auto-update-sa
roleRef:
  kind: Role
  name: auto-update-role
  apiGroup: rbac.authorization.k8s.io
