apiVersion: batch/v1
kind: CronJob
metadata:
  name: sqlserver-auto-backup
spec:
  # Lịch chạy: Chạy tự động mỗi 10 phút (*/10) theo múi giờ Việt Nam
  timeZone: "Asia/Ho_Chi_Minh"
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup-runner
              image: mcr.microsoft.com/mssql/server:2022-latest
              env:
                - name: TZ
                  value: "Asia/Ho_Chi_Minh"
                - name: SA_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: sqlserver-secret
                      key: sa-password
              command:
                - /bin/bash
                - -c
                - |
                  export TZ="Asia/Ho_Chi_Minh"
                  echo "============================================="
                  echo "Bat dau qua trinh backup SQL Server tu dong theo gio Viet Nam..."
                  TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
                  BACKUP_FILE="/var/opt/mssql/backup_auto_${TIMESTAMP}.bak"
                  
                  echo "Dang tao ban sao luu: ${BACKUP_FILE}"
                  
                  /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$SA_PASSWORD" -No -Q "
                    BACKUP DATABASE [WebBanHang-docker] 
                    TO DISK = '${BACKUP_FILE}' 
                    WITH FORMAT, MEDIANAME = 'SQLServerBackups', NAME = 'Full Backup';
                  "
                  
                  if [ $? -eq 0 ]; then
                    echo "============================================="
                    echo "Backup thanh cong! File da duoc luu vao PVC sqldata:"
                    echo "-> ${BACKUP_FILE}"
                    echo "============================================="
                  else
                    echo "Backup that bai! Vui long kiem tra lai ket noi SQL Server."
                    exit 1
                  fi

