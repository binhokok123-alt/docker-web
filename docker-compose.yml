services:
  webbanhang:
    image: thanhvippro/webbanhang:latest
    # TỰ ĐỘNG HÓA CI/CD: Bắt buộc Docker Compose luôn kiểm tra và tải Image mới nhất từ Docker Hub
    # về máy mỗi khi gõ 'docker compose up -d' (tránh việc Docker dùng lại bản image cũ lưu trong máy).
    # -> Nếu sau này chỉ muốn tự build code tại máy mà không kéo từ mạng, bạn có thể xóa dòng này hoặc đổi thành: build
    pull_policy: always
    build:
      context: .
      dockerfile: webbanhang/Dockerfile
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
    expose:
      - "8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=WebBanHang-docker;User Id=sa;Password=Binhok@123456;TrustServerCertificate=True
      - Vault__Address=http://vault:8200
      - Vault__Token=root
    volumes:
      - dpkeys:/app/dataprotection-keys
    depends_on:
      - sqlserver
      - vault

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    restart: unless-stopped

  vault-init:
    image: hashicorp/vault:latest
    container_name: vault-init
    depends_on:
      - vault
    restart: "no"
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      vault kv put secret/webbanhang ConnectionStrings__DefaultConnection='Server=sqlserver,1433;Database=WebBanHang-docker;User Id=sa;Password=Binhok@123456;TrustServerCertificate=True';
      echo 'Secret da duoc tao trong Vault thanh cong!';
      "

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - webbanhang

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Binhok@123456
    ports:
      - "1434:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Binhok@123456 -Q 'SELECT 1' -No || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s

volumes:
  sqldata:
  dpkeys:
