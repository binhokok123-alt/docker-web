services:
  webbanhang:
    image: thanhvippro/webbanhang:latest
    build:
      context: .
      dockerfile: webbanhang/Dockerfile
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
    expose:
      - "8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=WebBanHang-docker;User Id=sa;Password=Ctt@1234;TrustServerCertificate=True
    volumes:
      - dpkeys:/app/dataprotection-keys
    depends_on:
      - sqlserver

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - webbanhang

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Ctt@1234
    ports:
      - "1434:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ctt@1234 -Q 'SELECT 1' -No || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 10 --cleanup
    restart: always

volumes:
  sqldata:
  dpkeys:
