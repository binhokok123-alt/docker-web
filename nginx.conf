events {
    worker_connections 1024;
}

http {
    # Sử dụng DNS nội bộ của Docker (127.0.0.11) và tự động làm mới IP mỗi 2 giây
    resolver 127.0.0.11 valid=2s ipv6=off;

    server {
        listen 80;

        location / {
            # Dùng biến để Nginx liên tục truy vấn DNS cập nhật IP mới của webbanhang
            set $upstream_cluster http://webbanhang:8080;
            proxy_pass $upstream_cluster;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }
    }
}
