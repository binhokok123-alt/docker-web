events {
    worker_connections 1024;
}

http {
    upstream webbanhang_cluster {
        # Docker DNS tự động phân giải tên 'webbanhang' sang IP của cả 3 bản sao
        server webbanhang:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://webbanhang_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # TÍNH NĂNG HA: Tự động chuyển hướng ngay sang bản sao khác nếu 1 bản sao bị lỗi hoặc bị dừng
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
    }
}
